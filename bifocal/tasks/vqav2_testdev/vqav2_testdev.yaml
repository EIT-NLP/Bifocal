task: "vqav2_testdev"
dataset_path: lmms-lab/VQAv2
dataset_kwargs:
  token: True
test_split: testdev
output_type: generate_until
doc_to_visual: !function utils.vqav2_doc_to_visual
doc_to_text: !function utils.vqav2_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
process_results: !function utils.vqav2_process_results_test
metric_list:
  - metric: submission
    aggregation: !function utils.vqav2_aggregate_submissions
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
metadata:
  - version: 0.0
